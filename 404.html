<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找不到這一頁 — MEP 工具箱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* 404 可能被送到任意深度的網址，所以樣式全部內嵌、不依賴相對路徑 */
  :root{
    --bg:#0b1622; --grid:rgba(94,234,212,0.055);
    --accent:#5eead4; --text:#e8eef4; --text-dim:#8ea0b5;
    --sans:'Inter',system-ui,'Noto Sans TC',sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; padding:24px;
    display:flex; align-items:center; justify-content:center;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/28px 28px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/28px 28px,
      var(--bg);
    color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased;
  }
  .box{ max-width:440px; text-align:center; }
  .code{ font-family:var(--mono); font-size:64px; font-weight:600; color:var(--accent); line-height:1; margin-bottom:18px; }
  h1{ font-size:20px; margin:0 0 10px; font-weight:600; }
  p{ color:var(--text-dim); font-size:14px; line-height:1.65; margin:0 0 24px; }
  a{
    display:inline-block; font-family:var(--mono); font-size:13px;
    color:var(--accent); text-decoration:none;
    padding:10px 20px; border:1px solid var(--accent); border-radius:9px;
  }
  a:hover, a:focus-visible{ background:var(--accent); color:#04211d; }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>找不到這一頁</h1>
    <p>網址可能打錯了，或這支工具已經改名、搬家。到工具箱首頁看看目前有哪些工具。</p>
    <a id="home" href="/">回工具箱首頁</a>
  </div>
<script>
  // 專案型 Pages 會掛在 /<repo>/ 底下，這裡把首頁連結算出來
  var m = location.hostname.match(/^[\w-]+\.github\.io$/);
  var seg = location.pathname.split('/').filter(Boolean);
  document.getElementById('home').href = (m && seg.length) ? '/' + seg[0] + '/' : '/';
</script>
</body>
</html>
